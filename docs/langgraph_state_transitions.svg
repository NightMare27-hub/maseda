<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1020" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="425" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.3">MASEDA: LangGraph State Transition Architecture</text>
  <text x="425" y="60" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">Formal Node Transitions, Conditional Edge Routing &amp; Termination Guards</text>

  <!-- ========================================================================= -->
  <!-- 1. START NODE -->
  <!-- ========================================================================= -->
  <g transform="translate(345, 90)">
    <rect width="160" height="44" rx="22" fill="#1e293b" filter="url(#shadow)" />
    <text x="80" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1.5">START</text>
  </g>

  <!-- Edge: START -> PLANNER -->
  <line x1="425" y1="134" x2="425" y2="175" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)" />

  <!-- ========================================================================= -->
  <!-- 2. PLANNER NODE -->
  <!-- ========================================================================= -->
  <g transform="translate(245, 175)">
    <rect width="360" height="74" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
    <rect width="360" height="26" rx="12" fill="#dbeafe" />
    <rect y="16" width="360" height="10" fill="#dbeafe" />
    <text x="18" y="18" font-size="13" font-weight="700" fill="#1e40af">planner</text>
    <text x="342" y="18" text-anchor="end" font-size="11" font-weight="600" fill="#2563eb">Node 1</text>
    <text x="18" y="44" font-size="11" fill="#334155">• Decomposes task into steps &amp; target files</text>
    <text x="18" y="60" font-size="11" fill="#334155">• Formulates Dual-Contract (Logic vs Operational)</text>
  </g>

  <!-- Edge: PLANNER -> CODER -->
  <line x1="425" y1="249" x2="425" y2="295" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <rect x="360" y="262" width="130" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="425" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">State: plan, files</text>

  <!-- ========================================================================= -->
  <!-- 3. CODER NODE -->
  <!-- ========================================================================= -->
  <g transform="translate(245, 295)">
    <rect width="360" height="88" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
    <rect width="360" height="26" rx="12" fill="#dbeafe" />
    <rect y="16" width="360" height="10" fill="#dbeafe" />
    <text x="18" y="18" font-size="13" font-weight="700" fill="#1e40af">coder</text>
    <text x="342" y="18" text-anchor="end" font-size="11" font-weight="600" fill="#2563eb">Node 2</text>
    <text x="18" y="44" font-size="11" fill="#334155">• Mode A: Surgical Block Patching (in-place edits)</text>
    <text x="18" y="60" font-size="11" fill="#334155">• Mode B: Topological Scaffolding (new projects)</text>
    <text x="18" y="76" font-size="11" font-weight="600" fill="#b91c1c">• Tracks repeat edits (increments stagnation_count)</text>
  </g>

  <!-- Edge: CODER -> RUN_TESTS -->
  <line x1="425" y1="383" x2="425" y2="430" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <rect x="365" y="397" width="120" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="425" y="410" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">State: edits (patches)</text>

  <!-- ========================================================================= -->
  <!-- 4. RUN_TESTS NODE -->
  <!-- ========================================================================= -->
  <g transform="translate(245, 430)">
    <rect width="360" height="88" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)" />
    <rect width="360" height="26" rx="12" fill="#ccfbf1" />
    <rect y="16" width="360" height="10" fill="#ccfbf1" />
    <text x="18" y="18" font-size="13" font-weight="700" fill="#0f766e">run_tests (Sandbox Execution)</text>
    <text x="342" y="18" text-anchor="end" font-size="11" font-weight="600" fill="#0d9488">Node 3</text>
    <text x="18" y="44" font-size="11" fill="#334155">• AST syntax pre-check &amp; isolated tempdir copy</text>
    <text x="18" y="60" font-size="11" fill="#334155">• Headless pytest -q --maxfail=10</text>
    <text x="18" y="76" font-size="11" font-weight="600" fill="#0f766e">• Headless Streamlit AppTest &amp; Module Import smoke tests</text>
  </g>

  <!-- Edge: RUN_TESTS -> REVIEWER -->
  <line x1="425" y1="518" x2="425" y2="565" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <rect x="340" y="532" width="170" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="425" y="545" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">State: tests_passed, test_output</text>

  <!-- ========================================================================= -->
  <!-- 5. REVIEWER NODE -->
  <!-- ========================================================================= -->
  <g transform="translate(245, 565)">
    <rect width="360" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
    <rect width="360" height="26" rx="12" fill="#dbeafe" />
    <rect y="16" width="360" height="10" fill="#dbeafe" />
    <text x="18" y="18" font-size="13" font-weight="700" fill="#1e40af">reviewer</text>
    <text x="342" y="18" text-anchor="end" font-size="11" font-weight="600" fill="#2563eb">Node 4</text>
    <text x="18" y="44" font-size="11" fill="#334155">• Gate 1 (Automated): Diagnose test &amp; UI smoke failures</text>
    <text x="18" y="60" font-size="11" fill="#334155">• Gate 2 (Usability): Audit operational contract (anti-stub)</text>
    <text x="18" y="76" font-size="11" fill="#334155">• Emits review_approved verdict &amp; plain-English explanation</text>
    <text x="18" y="90" font-size="10.5" font-weight="600" fill="#2563eb">➔ Sets review_approved &amp; reviewer_feedback in State</text>
  </g>

  <!-- Edge: REVIEWER -> CONDITIONAL ROUTER -->
  <line x1="425" y1="661" x2="425" y2="705" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)" />

  <!-- ========================================================================= -->
  <!-- 6. CONDITIONAL EDGE (route() function) -->
  <!-- ========================================================================= -->
  <g transform="translate(335, 705)">
    <polygon points="90,0 180,38 90,76 0,38" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#shadow)" />
    <text x="90" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">route(state)</text>
    <text x="90" y="48" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">Conditional Edge</text>
  </g>

  <!-- Branch 1: ROUTE -> CODER (Retry Loop) -->
  <path d="M 335 743 Q 120 743 120 540 T 120 339 Q 120 339 240 339" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)" />
  <g transform="translate(60, 480)">
    <rect width="145" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)" />
    <text x="72" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Retry (return "coder")</text>
    <text x="72" y="32" text-anchor="middle" font-size="9" fill="#7f1d1d">not approved &amp; iter &lt; 3</text>
  </g>

  <!-- Branch 2: ROUTE -> END (Termination) -->
  <line x1="425" y1="781" x2="425" y2="855" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)" />
  
  <!-- Termination Conditions Box (Right of line) -->
  <g transform="translate(470, 785)">
    <rect width="320" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="12" y="16" font-size="10.5" font-weight="700" fill="#0f172a">Termination Criteria (return "end"):</text>
    <text x="12" y="32" font-size="10" font-weight="600" fill="#15803d">✔ Case 1: review_approved == True (Success)</text>
    <text x="12" y="47" font-size="10" font-weight="600" fill="#b45309">⚠ Case 2: iteration &gt;= MAX_ITERS (Limit 3)</text>
    <text x="12" y="61" font-size="10" font-weight="600" fill="#b91c1c">✖ Case 3: stagnation_count &gt;= 2 (Circuit Breaker)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 7. END NODE -->
  <!-- ========================================================================= -->
  <g transform="translate(345, 855)">
    <rect width="160" height="44" rx="22" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)" />
    <text x="80" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1.5">END</text>
  </g>

  <!-- Post-Execution Footnote -->
  <g transform="translate(245, 925)">
    <rect width="360" height="54" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="180" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Post-Workflow Actions (run_task in app/graph.py):</text>
    <text x="180" y="40" text-anchor="middle" font-size="10.5" fill="#475569">Computes diff via difflib | Logs JSONL audit | Applies to disk if --apply</text>
  </g>
</svg>
