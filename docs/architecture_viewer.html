<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASEDA - High-Level Architecture Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      max-width: 1200px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
    }
    p {
      margin: 4px 0 0 0;
      color: #94a3b8;
      font-size: 13px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    a.btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    a.btn:hover {
      background: #1d4ed8;
    }
    a.btn.secondary {
      background: #334155;
    }
    a.btn.secondary:hover {
      background: #475569;
    }
    .canvas-container {
      max-width: 1200px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>MASEDA: High-Level Architecture Diagram</h1>
      <p>Publication-Grade Vector Diagram for Dissertation, Slides &amp; Reports</p>
    </div>
    <div class="btn-group">
      <a href="maseda_high_level_architecture.png" download="maseda_high_level_architecture.png" class="btn">
        📷 Download PNG (Ready)
      </a>
      <a href="maseda_high_level_architecture.svg" download="maseda_high_level_architecture.svg" class="btn secondary">
        📥 Download SVG
      </a>
    </div>
  </div>

  <div class="canvas-container" id="svg-container">
    <img src="maseda_high_level_architecture.png" alt="MASEDA High-Level System Architecture" />
  </div>
</body>
</html>
