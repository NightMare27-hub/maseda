<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 920" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    <linearGradient id="failGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="420" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Figure 4.3: Re-verification Phase Process Flow</text>
  <text x="420" y="60" text-anchor="middle" font-size="12" fill="#64748b">Dual-Gate Quality Audit, Pydantic Schema Enforcement &amp; Reflective Reviewer Diagnostics</text>

  <!-- Start -->
  <rect x="230" y="85" width="380" height="46" rx="23" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Input: Test Logs + Proposed Diff + Task + Standards</text>

  <!-- Line 1 to 2 -->
  <line x1="420" y1="131" x2="420" y2="159" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 1: Prompt Assembly -->
  <rect x="210" y="161" width="420" height="52" rx="12" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Reviewer Prompt Assembly (app/agents/reviewer.py)</text>
  <text x="420" y="202" text-anchor="middle" font-size="11" fill="#475569">Injects diff, test stdout/stderr, guidelines &amp; dual-gate instructions</text>

  <!-- Line 2 to 3 -->
  <line x1="420" y1="213" x2="420" y2="241" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: LLM Call -->
  <rect x="230" y="243" width="380" height="52" rx="12" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">LLM Call via LiteLLM Gateway</text>
  <text x="420" y="284" text-anchor="middle" font-size="11" fill="#475569">Native JSON mode with dynamic model cascade failover</text>

  <!-- Line 3 to 4 -->
  <line x1="420" y1="295" x2="420" y2="323" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: Resilient Parsing & Pydantic Validation -->
  <rect x="190" y="325" width="460" height="56" rx="12" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Resilient Parser &amp; Pydantic Schema Validation</text>
  <text x="420" y="367" text-anchor="middle" font-size="11" fill="#475569">parse_json() + ReviewerSchema (reflects error back on retry)</text>

  <!-- Line 4 to Decision 1 -->
  <line x1="420" y1="381" x2="420" y2="409" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision: Gate 1 (Automated Verification) -->
  <polygon points="420,411 640,456 420,501 200,456" fill="url(#decisionGrad)" stroke="#ca8a04" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="451" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Gate 1: Automated Checks Pass?</text>
  <text x="420" y="468" text-anchor="middle" font-size="11" fill="#854d0e">(tests_passed == True &amp; exit code == 0)</text>

  <!-- Gate 1 Failed Branch (Right) -->
  <line x1="640" y1="456" x2="720" y2="456" stroke="#dc2626" stroke-width="1.8" />
  <line x1="720" y1="456" x2="720" y2="600" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)" />
  <text x="685" y="448" font-size="11" font-weight="600" fill="#dc2626">No (Failed)</text>

  <!-- Gate 1 Passed Branch (Down) -->
  <line x1="420" y1="501" x2="420" y2="531" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="432" y="520" font-size="11" font-weight="600" fill="#16a34a">Yes (Passed)</text>

  <!-- Decision: Gate 2 (Operational Usability Audit) -->
  <polygon points="420,533 640,578 420,623 200,578" fill="url(#gateGrad)" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="573" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Gate 2: Usability &amp; Contract Audit?</text>
  <text x="420" y="590" text-anchor="middle" font-size="11" fill="#5b21b6">No placeholders; cross-module consistency; UI/UX practical</text>

  <!-- Gate 2 Failed Branch (Right) -->
  <line x1="640" y1="578" x2="720" y2="578" stroke="#dc2626" stroke-width="1.8" />
  <text x="680" y="570" font-size="11" font-weight="600" fill="#dc2626">Reject</text>

  <!-- Gate 1/2 Failure Landing Box -->
  <rect x="610" y="602" width="220" height="74" rx="12" fill="url(#failGrad)" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)" />
  <text x="720" y="626" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Approval Denied</text>
  <text x="720" y="643" text-anchor="middle" font-size="10" fill="#b91c1c">approved = False</text>
  <text x="720" y="658" text-anchor="middle" font-size="10" fill="#b91c1c">Attach root-cause classification &amp;</text>
  <text x="720" y="670" text-anchor="middle" font-size="10" fill="#b91c1c">actionable suggested_fixes</text>

  <!-- Gate 2 Passed Branch (Down) -->
  <line x1="420" y1="623" x2="420" y2="659" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="432" y="645" font-size="11" font-weight="600" fill="#16a34a">Approved</text>

  <!-- Approval Granted Box -->
  <rect x="230" y="661" width="380" height="66" rx="12" fill="url(#passGrad)" stroke="#22c55e" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="685" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Approval Granted (approved = True)</text>
  <text x="420" y="703" text-anchor="middle" font-size="10" fill="#166534">Automated tests passed &amp; human usability standards satisfied</text>
  <text x="420" y="717" text-anchor="middle" font-size="10" fill="#166534">Synthesise non-technical user_explanation</text>

  <!-- Connect to State Update Box -->
  <line x1="420" y1="727" x2="420" y2="765" stroke="#334155" stroke-width="1.8" />
  <line x1="720" y1="676" x2="720" y2="765" stroke="#334155" stroke-width="1.8" />
  <line x1="420" y1="765" x2="720" y2="765" stroke="#334155" stroke-width="1.8" />
  <line x1="570" y1="765" x2="570" y2="785" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Commit State Update -->
  <rect x="200" y="787" width="440" height="58" rx="12" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="810" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Commit Partial State Update to LangGraph</text>
  <text x="420" y="828" text-anchor="middle" font-size="10" fill="#475569">Updates review_approved, reviewer_feedback, user_explanation, status</text>
  <text x="420" y="839" text-anchor="middle" font-size="10" fill="#64748b">(Logs token count, latency, and estimated cost)</text>

  <!-- Down to Router Hand-off -->
  <line x1="420" y1="845" x2="420" y2="873" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="240" y="875" width="360" height="38" rx="19" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" filter="url(#shadow)" />
  <text x="420" y="899" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">Hand-off to Phase 4.4: Graph Router &amp; Circuit Breakers</text>
</svg>
