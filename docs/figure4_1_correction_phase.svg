<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="rejectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Figure 4.1: Correction Phase Process Flow</text>
  <text x="400" y="60" text-anchor="middle" font-size="12" fill="#64748b">Planning, Code Generation, Path Sanitisation, Patch Resolution &amp; Pre-flight AST Validation</text>

  <!-- Node 1: Start -->
  <rect x="250" y="90" width="300" height="48" rx="24" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="400" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Receive Task + Target Repo Path</text>

  <!-- Arrow 1 to 2 -->
  <line x1="400" y1="138" x2="400" y2="168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 2: RAG Retrieval -->
  <rect x="220" y="170" width="360" height="56" rx="12" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="400" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">RAG Retrieval (Optional)</text>
  <text x="400" y="213" text-anchor="middle" font-size="11" fill="#475569">Modes: No-RAG | Dense (ChromaDB) | Hybrid (RRF k=60)</text>

  <!-- Arrow 2 to 3 -->
  <line x1="400" y1="226" x2="400" y2="256" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 3: Planner -->
  <rect x="210" y="258" width="380" height="56" rx="12" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="400" y="283" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Planner Agent (app/agents/planner.py)</text>
  <text x="400" y="301" text-anchor="middle" font-size="11" fill="#475569">Extracts Approach, Dual Contracts (Logic/UI), Target Files &amp; Steps</text>

  <!-- Arrow 3 to 4 -->
  <line x1="400" y1="314" x2="400" y2="344" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 4: Coder -->
  <rect x="200" y="346" width="400" height="62" rx="12" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="400" y="371" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Coder Agent (app/agents/coder.py)</text>
  <text x="400" y="391" text-anchor="middle" font-size="11" fill="#475569">Produces Full Replacement Files OR Surgical Patch Blocks</text>
  <text x="400" y="403" text-anchor="middle" font-size="10" fill="#64748b">(Multi-file dependency scaffolding when 3+ new files)</text>

  <!-- Arrow 4 to 5 -->
  <line x1="400" y1="408" x2="400" y2="444" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 1: safe_path check -->
  <polygon points="400,446 640,496 400,546 160,496" fill="url(#decisionGrad)" stroke="#ca8a04" stroke-width="1.8" filter="url(#shadow)" />
  <text x="400" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">safe_path() Sanitisation</text>
  <text x="400" y="508" text-anchor="middle" font-size="11" fill="#854d0e">Does every relative path stay within repo root?</text>

  <!-- Branch: safe_path escapes (Right to Drop) -->
  <line x1="640" y1="496" x2="710" y2="496" stroke="#dc2626" stroke-width="1.8" />
  <line x1="710" y1="496" x2="710" y2="600" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)" />
  <text x="680" y="488" font-size="11" font-weight="600" fill="#dc2626">Escape (Unsafe)</text>

  <!-- Safe Path Continues Down -->
  <line x1="400" y1="546" x2="400" y2="576" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <text x="412" y="563" font-size="11" font-weight="600" fill="#16a34a">Safe</text>

  <!-- Node 5: Patch Resolution & Unified Diff -->
  <rect x="230" y="578" width="340" height="54" rx="12" fill="url(#primaryGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)" />
  <text x="400" y="602" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Patch Resolution &amp; Diff Generation</text>
  <text x="400" y="620" text-anchor="middle" font-size="11" fill="#475569">Resolve edits to full contents; difflib generates unified diff</text>

  <!-- Arrow 5 to Decision 2 -->
  <line x1="400" y1="632" x2="400" y2="662" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 2: AST Parse -->
  <polygon points="400,664 640,714 400,764 160,714" fill="url(#decisionGrad)" stroke="#ca8a04" stroke-width="1.8" filter="url(#shadow)" />
  <text x="400" y="710" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">AST Syntax Pre-check</text>
  <text x="400" y="726" text-anchor="middle" font-size="11" fill="#854d0e">ast.parse(content, filename=rel)</text>

  <!-- Node: Dropped / Rejected -->
  <rect x="580" y="602" width="200" height="54" rx="10" fill="url(#rejectGrad)" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)" />
  <text x="680" y="625" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Drop Unsafe Path</text>
  <text x="680" y="641" text-anchor="middle" font-size="10" fill="#b91c1c">Log dropped file in State</text>

  <!-- AST SyntaxError Branch -->
  <line x1="640" y1="714" x2="710" y2="714" stroke="#dc2626" stroke-width="1.8" />
  <line x1="710" y1="714" x2="710" y2="760" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)" />
  <text x="668" y="706" font-size="11" font-weight="600" fill="#dc2626">SyntaxError</text>

  <rect x="580" y="762" width="200" height="58" rx="10" fill="url(#rejectGrad)" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)" />
  <text x="680" y="785" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Syntax Error Trapped</text>
  <text x="680" y="801" text-anchor="middle" font-size="10" fill="#b91c1c">Skip sandbox; package exact</text>
  <text x="680" y="813" text-anchor="middle" font-size="10" fill="#b91c1c">line &amp; col diagnostic for Reviewer</text>

  <!-- Pass to Verification Down -->
  <line x1="400" y1="764" x2="400" y2="796" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="412" y="782" font-size="11" font-weight="600" fill="#16a34a">Valid Syntax</text>

  <rect x="250" y="798" width="300" height="48" rx="24" fill="url(#passGrad)" stroke="#22c55e" stroke-width="1.8" filter="url(#shadow)" />
  <text x="400" y="827" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Pass to Phase 4.2: Verification</text>
</svg>
