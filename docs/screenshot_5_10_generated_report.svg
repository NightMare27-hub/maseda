  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <text x="100" y="26" font-size="12" fill="#94a3b8" font-family="'Cascadia Code', monospace">evaluation/results/baseline_report.md</text>
  <rect x="760" y="10" width="180" height="22" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="850" y="25" text-anchor="middle" font-size="11" fill="#38bdf8" font-weight="600">Markdown Preview</text>

  <!-- Main Document Canvas (Paper View) -->
