      <text x="150" y="21" font-size="11.5" font-weight="700" fill="#f8fafc">Tasks</text>
      <text x="250" y="21" font-size="11.5" font-weight="700" fill="#f8fafc">Passed</text>
      <text x="360" y="21" font-size="11.5" font-weight="700" fill="#f8fafc">Pass Rate</text>
      <text x="490" y="21" font-size="11.5" font-weight="700" fill="#f8fafc">Avg Rounds</text>
      <text x="610" y="21" font-size="11.5" font-weight="700" fill="#f8fafc">Avg Tokens</text>
      <text x="730" y="21" font-size="11.5" font-weight="700" fill="#f8fafc">Avg Time</text>

      <!-- Row 1: Bugfix -->
      <rect x="0" y="34" width="820" height="30" fill="#f8fafc" />
      <text x="18" y="54" font-size="11.5" font-weight="600" fill="#1e293b">Bugfix</text>
      <text x="150" y="54" font-size="11.5" fill="#475569">4</text>
      <text x="250" y="54" font-size="11.5" fill="#16a34a" font-weight="700">4</text>
      <rect x="355" y="40" width="65" height="18" rx="9" fill="#dcfce7" />
      <text x="387" y="53" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">100.0%</text>
      <text x="490" y="54" font-size="11.5" fill="#475569">1.0</text>
      <text x="610" y="54" font-size="11.5" fill="#475569">360.0</text>
      <text x="730" y="54" font-size="11.5" fill="#475569">0.3s</text>

      <!-- Row 2: Edge Case -->
      <rect x="0" y="64" width="820" height="30" fill="#ffffff" />
      <text x="18" y="84" font-size="11.5" font-weight="600" fill="#1e293b">Edge Case</text>
      <text x="150" y="84" font-size="11.5" fill="#475569">4</text>
      <text x="250" y="84" font-size="11.5" fill="#16a34a" font-weight="700">4</text>
      <rect x="355" y="70" width="65" height="18" rx="9" fill="#dcfce7" />
      <text x="387" y="83" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">100.0%</text>
      <text x="490" y="84" font-size="11.5" fill="#475569">1.0</text>
      <text x="610" y="84" font-size="11.5" fill="#475569">360.0</text>
      <text x="730" y="84" font-size="11.5" fill="#475569">0.3s</text>

      <!-- Row 3: Feature -->
      <rect x="0" y="94" width="820" height="30" fill="#f8fafc" />
      <text x="18" y="114" font-size="11.5" font-weight="600" fill="#1e293b">Feature</text>
      <text x="150" y="114" font-size="11.5" fill="#475569">10</text>
      <text x="250" y="114" font-size="11.5" fill="#16a34a" font-weight="700">10</text>
      <rect x="355" y="100" width="65" height="18" rx="9" fill="#dcfce7" />
      <text x="387" y="113" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">100.0%</text>
      <text x="490" y="114" font-size="11.5" fill="#475569">1.0</text>
      <text x="610" y="114" font-size="11.5" fill="#475569">360.0</text>
      <text x="730" y="114" font-size="11.5" fill="#475569">0.3s</text>

      <!-- Row 4: Multi File -->
      <rect x="0" y="124" width="820" height="30" fill="#ffffff" />
      <text x="18" y="144" font-size="11.5" font-weight="600" fill="#1e293b">Multi File</text>
      <text x="150" y="144" font-size="11.5" fill="#475569">2</text>
      <text x="250" y="144" font-size="11.5" fill="#16a34a" font-weight="700">2</text>
      <rect x="355" y="130" width="65" height="18" rx="9" fill="#dcfce7" />
      <text x="387" y="143" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">100.0%</text>
      <text x="490" y="144" font-size="11.5" fill="#475569">1.0</text>
      <text x="610" y="144" font-size="11.5" fill="#475569">360.0</text>
      <text x="730" y="144" font-size="11.5" fill="#475569">0.3s</text>

      <!-- Total Row -->
      <line x1="0" y1="154" x2="820" y2="154" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="0" y="155" width="820" height="30" fill="#f1f5f9" />
      <text x="18" y="175" font-size="12" font-weight="800" fill="#0f172a">Total / Overall</text>
      <text x="150" y="175" font-size="12" font-weight="700" fill="#0f172a">20</text>
      <text x="250" y="175" font-size="12" font-weight="800" fill="#15803d">20</text>
      <rect x="355" y="161" width="65" height="18" rx="9" fill="#22c55e" />
      <text x="387" y="174" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff">100.0%</text>
      <text x="490" y="175" font-size="12" font-weight="700" fill="#0f172a">1.0</text>
      <text x="610" y="175" font-size="12" font-weight="700" fill="#0f172a">360.0</text>
      <text x="730" y="175" font-size="12" font-weight="700" fill="#0f172a">0.3s</text>
    </g>

    <!-- LaTeX Code Section -->
    <text x="0" y="392" font-size="14" font-weight="700" fill="#0f172a">LaTeX Table Export (Dissertation Ready)</text>

    <!-- Dark Theme IDE Code Box -->
    <g transform="translate(0, 404)">
      <rect x="0" y="0" width="820" height="162" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="16" cy="14" r="3.5" fill="#64748b" />
      <circle cx="28" cy="14" r="3.5" fill="#64748b" />
      <circle cx="40" cy="14" r="3.5" fill="#64748b" />
      <text x="80" y="18" font-size="10" fill="#94a3b8" font-family="'Cascadia Code', monospace">LaTeX Snippet</text>

      <g transform="translate(16, 36)" font-family="'Cascadia Code', 'Courier New', monospace" font-size="11" line-height="1.4">
        <text x="0" y="0"><tspan fill="#c084fc">\begin</tspan><tspan fill="#f8fafc">{table}[htbp] </tspan><tspan fill="#38bdf8">\centering</tspan></text>
        <text x="0" y="18"><tspan fill="#c084fc">\caption</tspan><tspan fill="#fde047">{Baseline Multi-Agent Software Development Assistant (MASEDA) Performance}</tspan></text>
        <text x="0" y="36"><tspan fill="#c084fc">\label</tspan><tspan fill="#94a3b8">{tab:baseline_performance}</tspan></text>
        <text x="0" y="54"><tspan fill="#c084fc">\begin</tspan><tspan fill="#f8fafc">{tabular}{lcccccc} </tspan><tspan fill="#38bdf8">\hline</tspan></text>
        <text x="0" y="72"><tspan fill="#38bdf8">\textbf</tspan><tspan fill="#f8fafc">{Category} &amp; </tspan><tspan fill="#38bdf8">\textbf</tspan><tspan fill="#f8fafc">{Tasks} &amp; </tspan><tspan fill="#38bdf8">\textbf</tspan><tspan fill="#f8fafc">{Passed} &amp; </tspan><tspan fill="#38bdf8">\textbf</tspan><tspan fill="#f8fafc">{Pass Rate (\%)} &amp; </tspan><tspan fill="#38bdf8">\textbf</tspan><tspan fill="#f8fafc">{Avg Rounds} &amp; </tspan><tspan fill="#38bdf8">\textbf</tspan><tspan fill="#f8fafc">{Avg Tokens} &amp; </tspan><tspan fill="#38bdf8">\textbf</tspan><tspan fill="#f8fafc">{Avg Time} </tspan><tspan fill="#38bdf8">\\ \hline</tspan></text>
        <text x="0" y="90"><tspan fill="#f8fafc">Bugfix &amp; 4 &amp; 4 &amp; 100.0 &amp; 1.0 &amp; 360.0 &amp; 0.3 </tspan><tspan fill="#38bdf8">\\</tspan></text>
        <text x="0" y="108"><tspan fill="#38bdf8">\textbf</tspan><tspan fill="#4ade80">{Total / Overall} &amp; 20 &amp; 20 &amp; 100.0 &amp; 1.0 &amp; 360.0 &amp; 0.3 </tspan><tspan fill="#38bdf8">\\ \hline</tspan></text>
      </g>
    </g>
  </g>
</svg>
