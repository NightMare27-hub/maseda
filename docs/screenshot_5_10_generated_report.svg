    <text x="0" y="50" font-size="12" fill="#64748b">Generated: 2026-10-08 14:53:15  |  SWE-bench Style Pre-Fail Verification Active</text>

    <!-- Top KPI Cards Grid -->
    <g transform="translate(0, 68)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="190" height="62" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="16" y="22" font-size="10.5" font-weight="600" fill="#64748b" text-transform="uppercase">Total Tasks</text>
      <text x="16" y="48" font-size="20" font-weight="800" fill="#0f172a">20 / 20</text>

      <!-- Card 2 -->
      <rect x="210" y="0" width="190" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="226" y="22" font-size="10.5" font-weight="600" fill="#166534" text-transform="uppercase">Success Rate</text>
      <text x="226" y="48" font-size="20" font-weight="800" fill="#15803d">100.0%</text>

      <!-- Card 3 -->
      <rect x="420" y="0" width="190" height="62" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="436" y="22" font-size="10.5" font-weight="600" fill="#64748b" text-transform="uppercase">Avg Tokens / Task</text>
      <text x="436" y="48" font-size="20" font-weight="800" fill="#0f172a">360.0</text>

      <!-- Card 4 -->
      <rect x="630" y="0" width="190" height="62" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="646" y="22" font-size="10.5" font-weight="600" fill="#64748b" text-transform="uppercase">Avg Latency</text>
      <text x="646" y="48" font-size="20" font-weight="800" fill="#0f172a">0.30s</text>
    </g>

    <!-- Table Section Header -->
    <text x="0" y="162" font-size="15" font-weight="700" fill="#0f172a">Performance by Task Category</text>

